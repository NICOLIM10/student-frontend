<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Attendance</title>
</head>
<body>
  <h1>Daily Attendance</h1>
  <div id="container">Loading...</div>
  <script>
    const API = 'https://student-api-backend-df9c5l3gi-lim-s-mongodb.vercel.app/api/attendance';
    async function load() {
      try {
        const res = await fetch(API);
        const data = await res.json();
        const c = document.getElementById('container');
        c.innerHTML = '';
        data.forEach(r => {
          const d = document.createElement('div');
          d.textContent = `${r.name} - ${r.date} - ${r.status}`;
          c.appendChild(d);
        });
      } catch (e) {
        document.getElementById('container').innerText = 'Error loading attendance.';
      }
    }
    load();
  </script>
</body>
</html>
